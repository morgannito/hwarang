name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  smoke:
    name: protocole bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p hwarang-server

      # Lancement et verification dans le meme step : un process detache ne
      # survit pas de facon fiable d'un step a l'autre.
      #
      # Un serveur neuf par demonstration : chaque scenario part d'un monde
      # connu. Ce n'est pas un contournement — les demonstrations enchainees
      # passent aussi (verifie sur 40 passes consecutives) — mais un scenario
      # qui depend de ce qu'a laisse le precedent ne dit rien de clair en cas
      # d'echec.
      #
      # Les scripts rejouent le format binaire sans passer par hwarang-protocol,
      # donc ils verifient ce qui sort reellement sur le fil.
      - name: Demonstrations
        run: |
          set -euo pipefail

          run_demo() {
            local script="$1" port="$2"
            echo "--- $script ---"
            # Base neuve aussi : la persistance ferait qu'une demonstration
            # retrouverait le personnage laisse par la precedente.
            local db
            db="$(mktemp -d)/hwarang.sqlite"
            HWARANG_DB="$db" HWARANG_BIND="127.0.0.1:$port" \
              ./target/release/hwarang-server &
            local pid=$!
            python3 - "$port" <<'WAIT'
          import socket, sys, time
          port = int(sys.argv[1])
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  socket.create_connection(("127.0.0.1", port), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("le serveur n'a pas ouvert le port")
          WAIT
            python3 "scripts/$script" 127.0.0.1 "$port"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          run_demo smoke.py 13001
          run_demo two_clients.py 13002
          run_demo combat.py 13003
          run_demo creatures.py 13005

          # Ces deux scenarios demandent deux serveurs successifs sur la MEME
          # base : c'est tout leur objet, ils ne peuvent pas passer par `run_demo`.
          run_two_phase() {
            local script="$1" port="$2" db
            echo "--- $script ---"
            db="$(mktemp -d)/hwarang.sqlite"
            for phase in phase1 phase2; do
              HWARANG_DB="$db" HWARANG_BIND="127.0.0.1:$port" \
                ./target/release/hwarang-server &
              local pid=$!
              python3 - "$port" <<'WAIT'
          import socket, sys, time
          port = int(sys.argv[1])
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  socket.create_connection(("127.0.0.1", port), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("le serveur n'a pas ouvert le port")
          WAIT
              python3 "scripts/$script" 127.0.0.1 "$port" "$phase"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
          }

          run_two_phase persistence.py 13004
          run_two_phase items.py 13006

  client:
    name: client Godot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Installer Godot
        env:
          # Version epinglee : une mise a jour de Godot ne doit pas casser la CI
          # sans qu'on l'ait decide.
          GODOT_VERSION: 4.7.1
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download"
          url="$url/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Build du serveur
        run: cargo build --release -p hwarang-server

      # Ce test verifie ce qu'aucun test unitaire ne peut atteindre : que
      # l'encodage gros-boutiste de GDScript correspond a ce que le serveur Rust
      # emet. Une inversion d'octets passerait toutes les verifications internes
      # de chaque cote et ne se verrait qu'ici.
      - name: Client contre serveur
        run: |
          set -euo pipefail
          db="$(mktemp -d)/hwarang.sqlite"
          HWARANG_DB="$db" HWARANG_BIND=127.0.0.1:13100 \
            ./target/release/hwarang-server &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          python3 - <<'WAIT'
          import socket, sys, time
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  socket.create_connection(("127.0.0.1", 13100), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("le serveur n'a pas ouvert le port")
          WAIT

          # Premiere passe : importation des ressources. Sans elle, le script
          # s'execute avant que les classes globales ne soient enregistrees.
          godot --headless --path client --import || true
          godot --headless --path client --script res://tests/integration.gd -- --port 13100
