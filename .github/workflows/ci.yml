name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  smoke:
    name: protocole bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p hwarang-server

      # Lancement et verification dans le meme step : un process detache ne
      # survit pas de facon fiable d'un step a l'autre.
      #
      # Un serveur neuf par demonstration. Enchainer les scenarios sur un meme
      # monde les rend dependants de l'etat laisse par le precedent — entites en
      # cours de deconnexion, identifiants deja distribues — et introduit des
      # echecs intermittents qui ne disent rien du code teste.
      #
      # Les scripts rejouent le format binaire sans passer par hwarang-protocol,
      # donc ils verifient ce qui sort reellement sur le fil.
      - name: Demonstrations
        run: |
          set -euo pipefail

          run_demo() {
            local script="$1" port="$2"
            echo "--- $script ---"
            HWARANG_BIND="127.0.0.1:$port" ./target/release/hwarang-server &
            local pid=$!
            python3 - "$port" <<'WAIT'
          import socket, sys, time
          port = int(sys.argv[1])
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  socket.create_connection(("127.0.0.1", port), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("le serveur n'a pas ouvert le port")
          WAIT
            python3 "scripts/$script" 127.0.0.1 "$port"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          run_demo smoke.py 13001
          run_demo two_clients.py 13002
          run_demo combat.py 13003
